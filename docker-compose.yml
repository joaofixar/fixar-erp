services:
  web:
    image: fixar-erp-web
    build: ./docker/php
    ports:
      - "8080:80"
    volumes:
      - ./src:/var/www/html
      - ./docker/php/compatibilidade.php:/usr/local/etc/php/compatibilidade.php:ro
      - ./docker/php/php.ini:/usr/local/etc/php/conf.d/fixar.ini:ro
      - ./docker/php/saidas.php:/var/www/html/saidas.php:ro
    depends_on:
      db:
        condition: service_healthy
    networks:
      - interna

  db:
    image: mariadb:11
    ports:
      - "127.0.0.1:3306:3306"
    environment:
      MARIADB_ROOT_PASSWORD: fixar
      MARIADB_DATABASE: fixar
      MARIADB_USER: fixar
      MARIADB_PASSWORD: fixar
    healthcheck:
      test: ["CMD", "healthcheck.sh", "--connect", "--innodb_initialized"]
      interval: 3s
      timeout: 5s
      retries: 40
      start_period: 180s
    networks:
      - interna
      - banco-local
    volumes:
      - db-dados:/var/lib/mysql
      - ./banco/fotografia.sql:/docker-entrypoint-initdb.d/fotografia.sql:ro
      - ./banco/aplicar-rotinas-ausentes.sh:/docker-entrypoint-initdb.d/zz-rotinas.sh:ro
      - ./src/hardness3/scripts/sql:/rotinas/sql:ro
      - ./src/hardness3/scripts/atualizacaoBase-rotinas-lista.php:/rotinas/lista.php:ro

networks:
  interna:
    internal: true
  banco-local:

volumes:
  db-dados:
