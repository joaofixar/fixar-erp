<VirtualHost *:80>
    ServerName localhost
    DocumentRoot /var/www/html

    <Directory /var/www/html>
        Options -Indexes +FollowSymLinks
        AllowOverride All
        Require all granted
    </Directory>

    ErrorLog ${APACHE_LOG_DIR}/error.log
    # %D: microssegundos por requisição, para medir a lentidão das telas.
    LogFormat "%h %l %u %t \"%r\" %>s %b %D" tempo
    CustomLog ${APACHE_LOG_DIR}/access.log tempo
</VirtualHost>
