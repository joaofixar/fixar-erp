; O legado já tira depreciação, aviso e notice do relatório. A página não cai por função antiga.
expose_php=On
display_errors=Off
log_errors=On
error_reporting=E_ALL & ~E_DEPRECATED & ~E_NOTICE & ~E_WARNING
date.timezone=America/Fortaleza
default_charset=UTF-8
default_socket_timeout=3
auto_prepend_file=/usr/local/etc/php/compatibilidade.php
