; O legado já tira depreciação, aviso e notice do relatório. A página não cai por função antiga.
expose_php=On
display_errors=Off
log_errors=On
error_reporting=E_ALL & ~E_DEPRECATED & ~E_NOTICE & ~E_WARNING
date.timezone=America/Fortaleza
default_charset=UTF-8
default_socket_timeout=3
; A grade editada aparece em até 2 s. Conferir a data a cada requisição custava ~25% do clique
; com o src montado do Windows, porque um clique dispara várias requisições em sequência.
opcache.enable=1
opcache.validate_timestamps=1
opcache.revalidate_freq=2
auto_prepend_file=/usr/local/etc/php/compatibilidade.php
; Sem estas funções o processo não abre soquete para fora. O banco local usa o mysqli.
disable_functions=curl_exec,curl_multi_exec,fsockopen,pfsockopen,stream_socket_client,stream_socket_enable_crypto,mail
