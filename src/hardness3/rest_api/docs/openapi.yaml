              value:
                success: false
                error:
                  code: FIELD_BLOCKED
                  message: Campo bloqueado para filtro.
                  details:
                    field: T005_Senha_Interna
                meta:
                  request_id: req_01abc
            fieldNotFound:
              value:
                success: false
                error:
                  code: FIELD_NOT_FOUND
                  message: Campo não encontrado.
                  details:
                    field: T005_Campo_Inexistente
                meta:
                  request_id: req_01abc
            invalidFilter:
              value:
                success: false
                error:
                  code: INVALID_FILTER
                  message: Operador de filtro inválido.
                  details:
                    field: T003_Id
                    operator: contains
                meta:
                  request_id: req_01abc
            invalidSort:
              value:
                success: false
                error:
                  code: INVALID_SORT
                  message: Campo de ordenação inválido.
                  details:
                    field: ""
                meta:
                  request_id: req_01abc
            invalidJoins:
              value:
                success: false
                error:
                  code: INVALID_JOINS
                  message: Join manual inválido.
                  details:
                    join_index: 0
                    blocked_key: on
                meta:
                  request_id: req_01abc
    ListRecordsForbidden:
      description: Erros de autorizacao por tabela ou campo
      content:
        application/json:
          examples:
            tableNotAllowed:
              value:
                success: false
                error:
                  code: TABLE_NOT_ALLOWED
                  message: Table is not allowed
                  details:
                    table: D024
                meta:
                  request_id: req_01abc
            fieldNotAllowed:
              value:
                success: false
                error:
                  code: FIELD_NOT_ALLOWED
                  message: Campo não permitido.
                  details:
                    field: T005_Observacao_1
                meta:
                  request_id: req_01abc
    ListRecordsJoinNotFound:
      description: Erros de planejamento automatico de JOIN
      content:
