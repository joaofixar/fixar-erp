                'X-API-Token: hrd_live_xxxxxxxxxxxxx',
                'Content-Type: application/json',
                'Accept: application/json'
            ]
        ]);

        $response = curl_exec($curl);

        curl_close($curl);

        echo $response;
        ```

        **JavaScript / fetch**

        ```javascript
