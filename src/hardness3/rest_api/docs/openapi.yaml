    post:
      tags: [Records]
      summary: Insere registro validado
      description: |
        Insere um novo registro usando nomes reais dos campos da tabela.

        Regras principais:
        - nao aceita campo inexistente;
        - nao aceita campo bloqueado ou sensivel;
        - nao permite enviar PK auto increment manualmente;
        - FKs podem ser enviadas normalmente quando permitidas.
        - no `/api/docs`, este endpoint permanece documentado com exemplos, mas a execucao real fica bloqueada na interface Swagger.

        <details>
        <summary>Exemplos de consumo</summary>

        **cURL**

        ```bash
        curl -X POST "http://localhost/api/v1/tables/T005" \
          -H "X-API-Token: hrd_live_xxxxxxxxxxxxx" \
          -H "Content-Type: application/json" \
          -H "Accept: application/json" \
          -d '{
            "T005_D024_Id": 123,
            "T005_Observacao_1": "Teste"
          }'
        ```

        **PHP cURL**

        ```php
        <?php
        $url = 'http://localhost/api/v1/tables/T005';

        $payload = [
            'T005_D024_Id' => 123,
            'T005_Observacao_1' => 'Teste'
        ];

        $curl = curl_init($url);

        curl_setopt_array($curl, [
            CURLOPT_RETURNTRANSFER => true,
            CURLOPT_POST => true,
            CURLOPT_POSTFIELDS => json_encode($payload),
            CURLOPT_HTTPHEADER => [
                'X-API-Token: hrd_live_xxxxxxxxxxxxx',
                'Content-Type: application/json',
                'Accept: application/json'
            ]
        ]);

        $response = curl_exec($curl);

        curl_close($curl);

        echo $response;
        ```

        **JavaScript / fetch**

        ```javascript
        fetch('http://localhost/api/v1/tables/T005', {
            method: 'POST',
            headers: {
                'X-API-Token': 'hrd_live_xxxxxxxxxxxxx',
                'Content-Type': 'application/json',
                'Accept': 'application/json'
            },
            body: JSON.stringify({
                T005_D024_Id: 123,
                T005_Observacao_1: 'Teste'
            })
        })
        .then(response => response.json())
        .then(data => console.log(data));
        ```

        **Python requests**

        ```python
        import requests

        url = 'http://localhost/api/v1/tables/T005'

        headers = {
            'X-API-Token': 'hrd_live_xxxxxxxxxxxxx',
            'Content-Type': 'application/json',
            'Accept': 'application/json'
        }

        payload = {
            'T005_D024_Id': 123,
            'T005_Observacao_1': 'Teste'
        }

        response = requests.post(url, headers=headers, json=payload)

        print(response.json())
        ```

        </details>
