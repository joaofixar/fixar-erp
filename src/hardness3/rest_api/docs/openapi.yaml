components:
  securitySchemes:
    apiTokenAuth:
      type: apiKey
      in: header
      name: X-API-Token
  parameters:
    TableParam:
      name: table
      in: path
      required: true
      schema:
        type: string
      example: T005
    RecordIdParam:
      name: id
      in: path
      required: true
      schema:
        type: string
      example: "999"
      description: Valor da PK real da tabela.
    FieldsParam:
      name: fields
      in: query
      required: false
      schema:
        type: string
      example: T005_Id,T005_Observacao_1
      description: Lista separada por virgula com os campos que devem aparecer na resposta. Pode misturar campos da tabela base e de tabelas relacionadas autorizadas. Se `fields` estiver ausente ou vazio, a resposta volta apenas com os campos visíveis da tabela base.
    SortParam:
      name: sort
      in: query
      required: false
      schema:
        type: string
      description: Use `Campo` para ascendente ou `-Campo` para descendente. Campos da tabela base e de tabelas relacionadas autorizadas podem ser usados.
      examples:
        asc:
          value: T005_Id
        desc:
          value: -T005_Id
    LimitParam:
      name: limit
      in: query
      required: false
      schema:
        type: integer
        default: 25
        maximum: 100
      example: 50
      description: Quantidade de registros por página. Se não informado, o padrão é `25`. O valor máximo aceito é `100`.
    OffsetParam:
      name: offset
      in: query
      required: false
      schema:
        type: integer
        default: 0
        maximum: 10000
      example: 0
      description: Deslocamento da paginação. Use `0` para a primeira página, `100` para a segunda página quando `limit=100`, e assim por diante.
    FilterParam:
      name: filter
      in: query
      required: false
      style: deepObject
      explode: true
      schema:
        type: object
        additionalProperties: true
      description: |
        Formato geral:
        `filter[Campo][operador]=valor`

        `Campo` e o nome real da coluna.
        `operador` define a comparacao.
        `valor` e o valor filtrado.

        Campos da tabela base e de tabelas relacionadas autorizadas podem ser usados.
        FKs podem ser usadas normalmente em filtros. Exemplo:
        `filter[T006_T005_Id][eq]=500`

        Formatos suportados:
        - `filter[Campo][eq]=valor`
          igual a `valor`
        - `filter[Campo][neq]=valor`
          diferente de `valor`
        - `filter[Campo][gt]=valor`
          maior que `valor`
        - `filter[Campo][gte]=valor`
          maior ou igual a `valor`
        - `filter[Campo][lt]=valor`
          menor que `valor`
        - `filter[Campo][lte]=valor`
          menor ou igual a `valor`
        - `filter[Campo][like]=valor`
          contem `valor`
        - `filter[Campo][in]=A,F`
          valor dentro da lista `A,F`
        - `filter[Campo][between]=2026-01-01,2026-01-31`
          valor dentro do intervalo informado
        - `filter[Campo][isnull]=1`
          retorna registros onde o campo esta nulo
      examples:
        byFk:
          summary: Filtro por FK
          value:
            T006_T005_Id:
              eq: 500
        likeText:
          summary: Contem texto
          value:
            T005_Observacao_1:
              like: teste
        inStatus:
          summary: Lista de valores
          value:
            T005_Status:
              in: A,F
        betweenDate:
          summary: Intervalo de datas
          value:
            T005_Data:
              between: 2026-01-01,2026-01-31
    JoinsParam:
      name: joins
      in: query
      required: false
      schema:
        type: string
      example: >-
        [{"table":"T013","type":"left","conditions":[{"leftField":"T013_Chave_Acesso_Nfe","operator":"=","rightField":"RNE001_Chave_Acesso"},{"leftField":"T013_Flag_Cancelada","operator":"=","value":"N"}]}]
      description: |
        JOIN manual opcional. O formato documentado e uma string JSON contendo um array de joins.

        Cada item aceita:
        - `table`: tabela destino do join;
        - `type`: atualmente apenas `left`;
        - `conditions`: lista obrigatoria de condicoes estruturadas.

        Cada condicao aceita:
        - `leftField`: campo do lado esquerdo;
        - `operator`: `=`, `!=`, `>`, `>=`, `<`, `<=`;
        - `rightField`: campo do lado direito quando a condicao compara dois campos; ou
        - `value`: valor literal quando a condicao compara campo com valor.

        Se uma tabela ja tiver JOIN automatico e `joins` trouxer um JOIN manual para essa mesma tabela, o JOIN manual substitui o automatico.
  schemas:
    SuccessObject:
      type: object
      properties:
        success:
          type: boolean
          example: true
        data:
          type: object
          additionalProperties: true
        meta:
          type: object
          additionalProperties: true
    ErrorObject:
