openapi: 3.0.3
info:
  title: Hardness REST API
  version: v1
  description: |
    API REST generica para integracao externa com o ERP.

    - O metodo HTTP define a acao:
      - `GET` consulta
      - `POST` insere
      - `PATCH` atualiza parcialmente
      - `PUT` nao esta disponivel
      - `DELETE` nao esta disponivel
    - O tenant e resolvido exclusivamente pelo host/domínio.
    - O token deve ser enviado em `X-API-Token: <token>`.
    - `Authorization: Bearer <token>` continua aceito por compatibilidade, mas `X-API-Token` e o formato oficial recomendado.
    - O `{id}` da URL sempre representa a **PK real** da tabela.
    - FKs podem ser usadas em filtros e podem ser enviadas em payloads quando permitidas.
    - A PK real nao pode ser alterada no payload.
    - A PK real da tabela entra automaticamente para leitura, schema, `fields`, `filter` e `sort`, mesmo quando a tabela estiver em modo `allow`.
    - Tabelas internas como `A001` e `A002` sao bloqueadas.
    - Campos sensiveis podem ser ocultados no schema, resposta e auditoria.
    - No `/api/docs`, apenas leitura e `/validate` executam de verdade. `POST` e `PATCH` reais ficam documentados, mas a execucao e bloqueada na interface Swagger.

    O acesso às tabelas, campos e operações da API é controlado por política de segurança por cliente.

    Dependendo do ambiente e das permissões liberadas, algumas tabelas, campos ou funcionalidades podem não estar disponíveis.

    Caso precise acesso a alguma estrutura específica, solicite a liberação junto à equipe Hardness.

    Disponibilidade por tabela:
    - se a tabela estiver liberada, ela pode ser usada nos endpoints documentados da própria tabela, respeitando a política de acesso e as proteções globais da API;
    - se a tabela não estiver liberada, ela não aparece em `/tables` ou retorna `TABLE_NOT_ALLOWED` ao tentar usar o endpoint específico.

    Disponibilidade por campo:
    - se o campo estiver liberado, ele pode aparecer no schema, retornar em leitura, ser usado em `fields`, `filter` e `sort`, e também ser enviado em `POST` e `PATCH` quando permitido;
    - se o campo não estiver liberado, ele pode ser ocultado no schema/resposta ou retornar `FIELD_NOT_ALLOWED`, dependendo da operação.
externalDocs:
  description: Postman Collection da API
  url: /api/docs/postman_collection.json
servers:
  - url: /api/v1
    description: Base path da API
tags:
  - name: Infra
    description: Endpoints publicos de saude e versao.
  - name: Auth
    description: Validacao de token e contexto autenticado.
  - name: Metadata
    description: Descoberta de tabelas e schema filtrado pela blocklist.
  - name: Records
    description: Leitura e escrita validadas usando nomes reais de tabela e campo.
security:
  - apiTokenAuth: []
paths:
  /health:
    get:
      tags: [Infra]
      summary: Healthcheck da API
      security: []
      responses:
        '200':
          description: API ativa
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SuccessObject'
              example:
                success: true
                data:
                  status: ok
                  service: Hardness REST API
                meta:
                  request_id: req_01abc
  /version:
    get:
      tags: [Infra]
      summary: Versao da API
      security: []
      responses:
        '200':
          description: Versao atual
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SuccessObject'
              example:
                success: true
                data:
                  version: v1
                  base_path: /api/v1
                  service: Hardness REST API
                meta:
                  request_id: req_01abc
  /auth/me:
    get:
      tags: [Auth]
      summary: Valida token e retorna contexto autenticado
      operationId: authMe
      responses:
        '200':
          description: Token autenticado
          content:
            application/json:
              example:
                success: true
                data:
                  authenticated: true
                  token:
                    id: 1
                    name: Integracao Principal
                    prefix: hrd_live_abc
                    status: active
                  tenant:
                    database: e998
                    host: exemplo.hardness.com.br
                meta:
                  request_id: req_01abc
        '401':
          description: Token ausente ou invalido
          content:
            application/json:
              examples:
                missing:
                  value:
                    success: false
                    error:
                      code: TOKEN_MISSING
                      message: Token nao informado.
                      details: {}
                    meta:
                      request_id: req_01abc
                invalid:
                  value:
                    success: false
                    error:
                      code: TOKEN_INVALID
                      message: Token inválido.
                      details: {}
                    meta:
                      request_id: req_01abc
        '403':
          description: Token inativo ou revogado
          content:
            application/json:
              example:
                success: false
                error:
                  code: TOKEN_INACTIVE
                  message: Token inativo ou revogado.
                  details: {}
                meta:
                  request_id: req_01abc
  /tables:
    get:
      tags: [Metadata]
      summary: Lista tabelas permitidas
      operationId: listTables
      responses:
        '200':
          description: Lista filtrada por blocklist estrutural e AccessPolicy. Quando nenhuma tabela estiver liberada, a lista pode voltar vazia.
          content:
            application/json:
              example:
                success: true
                data:
                  tables:
                    - name: T005
                    - name: T006
                meta:
                  request_id: req_01abc
                  count: 2
  /tables/{table}/schema:
    get:
      tags: [Metadata]
      summary: Retorna o schema filtrado de uma tabela
      operationId: getSchema
      parameters:
        - $ref: '#/components/parameters/TableParam'
      responses:
        '200':
          description: Schema visivel da tabela
          content:
            application/json:
              example:
                success: true
                data:
                  table: T005
                  database: e998
                  primary_key: T005_Id
                  fields:
                    - name: T005_Id
                      data_type: int
                      nullable: false
                      default: null
                      key: PRI
                      extra: auto_increment
                      max_length: null
                      is_primary_key: true
                      is_auto_increment: true
                    - name: T005_D024_Id
                      data_type: int
                      nullable: false
                      default: null
                      key: ""
                      extra: ""
                      max_length: null
                      is_primary_key: false
                      is_auto_increment: false
                meta:
                  request_id: req_01abc
        '403':
          $ref: '#/components/responses/TableNotAllowed'
  /tables/{table}:
    get:
      tags: [Records]
      summary: Lista registros com filtros seguros
      description: |
        Consulta registros usando o nome real da tabela e filtros controlados.

        ### 1. Consulta simples (compatibilidade)
        Consultas antigas continuam funcionando sem nenhuma alteração para os clientes existentes.

        Exemplos compatíveis:
        - `GET /tables/T005`
        - `GET /tables/T005?fields=T005_Id,T005_Observacao_1`
        - `GET /tables/T005?filter[T005_Id][eq]=1`
        - `GET /tables/T005?sort=T005_Id`

        ### 2. JOIN automático
        Quando `fields`, `filter` ou `sort` mencionam campos de outra tabela, a API tenta descobrir automaticamente o relacionamento físico no schema.

        Convenção suportada hoje:
        - `SOURCE_TARGET_Id`
        - `T005_T003_Id -> T003.T003_Id`
        - `D009_D001_Id -> D001.D001_Id`

        Exemplo:
        `GET /api/v1/tables/T005?fields=T005_Id,T003_Id`

        SQL equivalente:
        ```sql
        SELECT
          T005.T005_Id,
          T003.T003_Id
        FROM T005
        LEFT JOIN T003
          ON T005.T005_T003_Id = T003.T003_Id
        ```

        O JOIN automático usa sempre `LEFT JOIN`.

        ### 3. Filtros
        Formato geral:
        - `filter[Campo][operador]=valor`

        Operadores suportados hoje:
        - `eq`: igual a
        - `neq`: diferente de
        - `gt`: maior que
        - `gte`: maior ou igual a
        - `lt`: menor que
        - `lte`: menor ou igual a
        - `like`: contém o valor informado
        - `in`: valor dentro de uma lista separada por vírgula
        - `between`: valor dentro de um intervalo
        - `isnull`: verifica se o campo é nulo

        Filtros também podem usar campos de tabelas relacionadas. Quando isso acontece, a API realiza o JOIN necessário automaticamente.

        Exemplos:
        - `filter[T003_Id][eq]=2321`
        - `filter[T003_Id][neq]=2321`
        - `filter[T003_Id][gt]=1000`
        - `filter[T003_Id][gte]=1000`
        - `filter[T003_Id][lt]=5000`
        - `filter[T003_Id][lte]=5000`
        - `filter[T003_Observacao_1][like]=teste`
        - `filter[T003_Flag_Perdido][in]=N,S`
        - `filter[T003_Data_Emissao][between]=2026-01-01,2026-01-31`
        - `filter[T003_Observacao_2][isnull]=1`

        Exemplo completo:
        `GET /api/v1/tables/T005?fields=T005_Id,T003_Id&filter[T003_Id][eq]=2321`

        ### 4. Ordenação
        A ordenação aceita campos da tabela base ou de tabelas relacionadas autorizadas:
        - `sort=T003_Id` para ascendente
        - `sort=-T003_Id` para descendente

        Exemplos:
        - `GET /api/v1/tables/T005?fields=T005_Id,T003_Id&sort=T003_Id`
        - `GET /api/v1/tables/T005?fields=T005_Id,T003_Id&sort=-T003_Id`

        ### 5. JOIN manual
        Use `joins` quando:
        - não existe relacionamento automático suportado pela convenção atual;
        - deseja sobrescrever o relacionamento automático para uma tabela específica;
        - precisa de múltiplas condições no `ON`.

        Formato aceito:
        ```json
        [
          {
            "table": "T013",
            "type": "left",
            "conditions": [
              {
                "leftField": "T013_Chave_Acesso_Nfe",
                "operator": "=",
                "rightField": "RNE001_Chave_Acesso"
              },
              {
                "leftField": "T013_Flag_Cancelada",
                "operator": "=",
                "value": "N"
              }
            ]
          }
        ]
        ```

        Regras atuais do JOIN manual:
        - `table`: tabela que será adicionada ao plano;
        - `type`: atualmente apenas `left`;
        - `conditions`: lista obrigatória de condições estruturadas;
        - `leftField`: campo do lado esquerdo da condição;
        - `rightField`: campo do lado direito quando a condição compara dois campos;
        - `value`: valor literal quando a condição compara campo com valor;
        - `operator`: atualmente aceita apenas `=`, `!=`, `>`, `>=`, `<`, `<=`;
        - SQL textual não é aceito em `on`, `extraCondition`, `expression`, `sql`, `rawSql` ou `raw_sql`.

        Exemplo de SQL equivalente para o JOIN manual acima:
        ```sql
        SELECT
          RNE001.RNE001_Id,
          RNE001.RNE001_Chave_Acesso,
          T013.T013_Id,
          T013.T013_Numero_Nota_Fiscal
        FROM RNE001
        LEFT JOIN T013
          ON (
            T013.T013_Chave_Acesso_Nfe = RNE001.RNE001_Chave_Acesso
            AND T013.T013_Flag_Cancelada = :join_1
          )
        ```

        ### 6. Override do JOIN automático
        Se a API já conseguir montar um JOIN automático para uma tabela e a requisição enviar um JOIN manual para essa mesma tabela, o JOIN manual substitui o automático.

        Exemplo:
        ```json
        [
          {
            "table": "T003",
            "type": "left",
            "conditions": [
              {
                "leftField": "T003_Id",
                "operator": "=",
                "rightField": "T005_T003_Id"
              },
              {
                "leftField": "T003_Flag_Perdido",
                "operator": "=",
                "value": "N"
              }
            ]
          }
        ]
        ```

        ### 7. Autorização
        A leitura continua sujeita à mesma política de segurança do cliente:
        - `Access Policy` controla quais tabelas e campos podem ser lidos;
        - a blocklist estrutural continua bloqueando tabelas internas;
        - tabelas explicitamente pedidas em `fields`, `filter`, `sort` ou `joins` são verificadas antes do planejamento;
        - se a tabela existir mas não estiver liberada, a API retorna `TABLE_NOT_ALLOWED`;
        - se o campo existir mas não estiver liberado, a API retorna `FIELD_NOT_ALLOWED`.

        Para caminhos automáticos, o planner pode ignorar tabelas intermediárias proibidas. Isso não muda o tratamento de tabelas explicitamente solicitadas pelo cliente.

        ### 8. Erros de consulta
        Erros mais comuns deste endpoint:
        - `TABLE_NOT_ALLOWED`: a tabela existe, mas não está liberada para a policy do cliente;
        - `FIELD_NOT_ALLOWED`: o campo existe, mas não está liberado para leitura;
        - `FIELD_NOT_FOUND`: o campo informado não existe no schema disponível para a consulta;
        - `JOIN_TABLE_NOT_FOUND`: a tabela necessária para o planejamento automático não foi encontrada;
        - `JOIN_PATH_NOT_FOUND`: não existe caminho automático entre a tabela base e a tabela solicitada;
        - `INVALID_FILTER`: a estrutura do filtro ou o operador enviado é inválido;
        - `INVALID_SORT`: o parâmetro `sort` está malformado;
        - `INVALID_JOINS`: o parâmetro `joins` está malformado ou usa opções não suportadas.

        Observação importante:
        - campo inexistente em `sort` ou `filter` continua retornando `FIELD_NOT_FOUND`;
        - `INVALID_SORT` e `INVALID_FILTER` são usados quando a estrutura da query é inválida;
        - o código implementado hoje para JOIN manual inválido é `INVALID_JOINS`.

        ### 9. Paginação
        - se `limit` não for informado, a API retorna `25` registros por padrão;
        - o máximo por requisição é `100`;
        - para buscar mais registros, use `offset`;
        - a resposta informa a paginação em `meta.pagination`;
        - se `returned` vier menor que `limit`, normalmente você chegou ao fim da listagem;
        - se `returned` vier igual a `limit`, pode existir próxima página.

        Exemplo:
        - página 1: `?limit=100&offset=0`
        - página 2: `?limit=100&offset=100`

        ### 10. Comportamento de `fields` vazio
        Quando `fields` não é informado, ou é enviado vazio, a resposta retorna apenas os campos visíveis da tabela base.

        Isso continua valendo mesmo quando filtros, ordenação ou JOINs internos usam tabelas relacionadas.

        Exemplo:
        `GET /api/v1/tables/T005?filter[T003_Id][eq]=1`

        Nesse caso a API pode usar `T003` internamente para montar a consulta, mas a resposta continua contendo apenas colunas visíveis de `T005`.

        ### Limitações Atuais
        O comportamento implementado hoje possui as seguintes limitações:
        - o JOIN automático funciona apenas para relacionamentos no padrão `SOURCE_TARGET_Id`;
        - relacionamentos com papel ou contexto não entram no planejamento automático;
        - exemplos que precisam de JOIN manual:
          - `T084_D024_Destinatario_Id`
          - `T084_D024_Remetente_Id`
          - `T005_Pgto_C007_Id`
          - `T005_Liberou_Alcada_C007_Id`
        - o JOIN automático utiliza sempre `LEFT JOIN`;
        - não existe suporte a SQL textual no parâmetro `joins`.

        Exemplos de filtros:
        - `filter[T005_Id][eq]=999`
        - `filter[T005_Observacao_1][like]=teste`
        - `filter[T005_Status][in]=A,F`
        - `filter[T005_Data][between]=2026-01-01,2026-01-31`

        <details>
        <summary>Exemplos de consumo</summary>

        **cURL**

        ```bash
        curl -X GET "http://localhost/api/v1/tables/T005?limit=10" \
          -H "X-API-Token: hrd_live_xxxxxxxxxxxxx" \
          -H "Accept: application/json"
        ```

        **PHP cURL**

        ```php
        <?php
        $url = 'http://localhost/api/v1/tables/T005?limit=10';

        $curl = curl_init($url);

        curl_setopt_array($curl, [
            CURLOPT_RETURNTRANSFER => true,
            CURLOPT_HTTPHEADER => [
                'X-API-Token: hrd_live_xxxxxxxxxxxxx',
                'Accept: application/json'
            ]
        ]);

        $response = curl_exec($curl);

        curl_close($curl);

        echo $response;
        ```

        **JavaScript / fetch**

        ```javascript
        fetch('http://localhost/api/v1/tables/T005?limit=10', {
            method: 'GET',
            headers: {
                'X-API-Token': 'hrd_live_xxxxxxxxxxxxx',
                'Accept': 'application/json'
            }
        })
        .then(response => response.json())
        .then(data => console.log(data));
        ```

        **Python requests**

        ```python
        import requests

        url = 'http://localhost/api/v1/tables/T005?limit=10'

        headers = {
            'X-API-Token': 'hrd_live_xxxxxxxxxxxxx',
            'Accept': 'application/json'
        }

        response = requests.get(url, headers=headers)

        print(response.json())
        ```

        **Filtro por FK**

        ```bash
        curl -X GET "http://localhost/api/v1/tables/T006?filter[T006_T005_Id][eq]=500" \
          -H "X-API-Token: hrd_live_xxxxxxxxxxxxx" \
          -H "Accept: application/json"
        ```

        **JOIN automático**

        ```bash
        curl -X GET "http://localhost/api/v1/tables/T005?fields=T005_Id,T003_Id&filter[T003_Id][eq]=2321&sort=-T003_Id" \
          -H "X-API-Token: hrd_live_xxxxxxxxxxxxx" \
          -H "Accept: application/json"
        ```

        **JOIN manual**

        ```bash
        curl -G "http://localhost/api/v1/tables/RNE001" \
          -H "X-API-Token: hrd_live_xxxxxxxxxxxxx" \
          -H "Accept: application/json" \
          --data-urlencode "fields=RNE001_Id,RNE001_Chave_Acesso,T013_Id,T013_Numero_Nota_Fiscal" \
          --data-urlencode 'joins=[{"table":"T013","type":"left","conditions":[{"leftField":"T013_Chave_Acesso_Nfe","operator":"=","rightField":"RNE001_Chave_Acesso"},{"leftField":"T013_Flag_Cancelada","operator":"=","value":"N"}]}]'
        ```

        </details>
      operationId: listRecords
