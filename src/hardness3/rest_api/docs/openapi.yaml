        `PUT` e `DELETE` nao estao disponiveis nesta API.
        No `/api/docs`, este endpoint permanece documentado com exemplos, mas a execucao real fica bloqueada na interface Swagger.

        Exemplo:
        `PATCH /api/v1/tables/T005/999`

        Payload:
        ```json
